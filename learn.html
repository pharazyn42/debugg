<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debugg Learn</title>
<meta name="description" content="Learn to code from the very start with short lessons: read a little, answer a question, and move on when you get it right.">
<link rel="stylesheet" href="base.css">
<style>
  .modes{ display: flex; justify-content: center; gap: 6px; margin: 0 0 16px; }
  .stats{
    display: flex;
    gap: 10px;
    margin: 0 0 18px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .stat{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .stat.grow{ flex: 1; }
  .stat-label{ color: var(--text-faint); letter-spacing: 0.06em; text-transform: uppercase; }
  .stat-value{ color: var(--amber); font-size: 20px; font-weight: 600; }
  .stat-note{ color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .xp-bar{ height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .xp-fill{ height: 100%; background: var(--amber); border-radius: 3px; transition: width 0.6s ease; }

  /* The course map */
  .unit{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .unit.locked, .unit.planned{ opacity: 0.55; }
  .unit.passed{ border-color: var(--green-dim); }
  .unit-head{ display: flex; justify-content: space-between; align-items: center; }
  .unit-num{ font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); }
  .unit-badge{ font-family: var(--mono); font-size: 11px; color: var(--green); }
  .unit-badge.soon{ color: var(--text-faint); }
  .unit h2{ font-size: 18px; margin: 6px 0 4px; }
  .unit-summary, .unit-lock, .unit-note{ color: var(--text-dim); font-size: 13.5px; margin: 0 0 12px; line-height: 1.5; }
  .unit-note{ margin: 10px 0 0; font-size: 12.5px; color: var(--text-faint); }
  .lessons{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .lesson-row{
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    text-align: left;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    font-weight: 500;
  }
  .lesson-row:hover:not(:disabled){ border-color: var(--text-faint); }
  .lesson-row:disabled{ color: var(--text-faint); cursor: not-allowed; }
  .lesson-row.checkpoint{ border-style: dashed; }
  .lesson-row.done .lesson-name{ color: var(--text-dim); }
  .lesson-state{ font-family: var(--mono); font-size: 12px; color: var(--amber); white-space: nowrap; }
  .stars{ letter-spacing: 0.1em; }

  /* A lesson */
  .session-top{ display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .btn-small{ padding: 7px 11px; font-size: 12.5px; }
  .progress{ flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .progress-fill{ height: 100%; background: var(--green); border-radius: 4px; transition: width 0.3s ease; }
  .progress-num{ font-family: var(--mono); font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .step{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
  }
  .step h3{ margin: 0 0 8px; font-size: 17px; }
  .teach, .question{ color: var(--text); font-size: 15px; line-height: 1.6; margin: 0 0 14px; }
  .question{ font-weight: 600; }
  .teach code, .question code, .feedback code{
    background: var(--bg);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.9em;
  }
  .step .editor{ margin: 0 0 14px; white-space: pre; }
  .step .editor code{ display: block; }
  .output{ background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0 0 14px; }
  .output-label{ font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }
  .output pre{ margin: 6px 0 0; font-family: var(--mono); font-size: 14px; color: var(--green); }
  .options{ display: flex; flex-direction: column; gap: 8px; margin: 0 0 12px; }
  .option{
    text-align: left;
    background: var(--panel-2);
    color: var(--text);
    border: 1.5px solid var(--line);
    font-weight: 500;
  }
  .option:hover:not(:disabled){ border-color: var(--amber); }
  .option:disabled{ cursor: default; }
  .option.right{ border-color: var(--green); background: var(--green-dim); }
  .option.wrong{ border-color: var(--red); background: var(--red-dim); }
  .gap{ border-bottom: 2px solid var(--amber); padding: 0 3px; color: var(--amber); }
  .code-line{
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 0 6px;
    font: inherit;
    color: inherit;
    white-space: pre;
  }
  .code-line:hover:not(:disabled){ border-color: var(--amber); }
  .code-line:disabled{ cursor: default; }
  .code-line.right{ border-color: var(--green); background: var(--green-dim); }
  .code-line.wrong{ border-color: var(--red); background: var(--red-dim); }
  .feedback{ display: none; border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.55; margin: 0 0 12px; }
  .feedback.show{ display: block; }
  .feedback.correct{ background: var(--green-dim); color: #d8f5e5; }
  .feedback.wrong{ background: var(--red-dim); color: #f7dada; }
  .feedback .right-answer{ display: block; margin: 6px 0 2px; font-weight: 600; }
  .feedback .again{ display: block; margin-top: 8px; font-size: 12.5px; opacity: 0.8; }
  .step-actions{ display: flex; gap: 8px; flex-wrap: wrap; }
  .step-actions [hidden]{ display: none; }
  .guess-row{ margin-bottom: 12px; }

  .summary{ background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px 18px; text-align: center; }
  .summary h2{ margin: 4px 0 8px; }
  .summary p{ color: var(--text-dim); margin: 0 0 12px; }
  .summary .step-actions{ justify-content: center; }
  .big-stars{ font-size: 34px; color: var(--amber) !important; letter-spacing: 0.12em; margin: 0 !important; }
  .big-score{ font-family: var(--mono); font-size: 34px; color: var(--amber) !important; margin: 0 !important; }
  footer .footer-links{ margin-top: 6px; line-height: 1.8; }
  footer a{ color: inherit; text-decoration: underline; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <nav class="modes" aria-label="Debugg"><a class="lang-tab" href="index.html">Daily</a><a class="lang-tab" href="learn.html" aria-current="page">Learn</a></nav>
    <p class="kicker">Debugg · Learn</p>
    <h1 id="title">Learn</h1>
    <p class="sub" id="sub"></p>
  </header>

  <nav class="langs" id="langs" aria-label="Course" hidden></nav>
  <div class="stats" id="stats"></div>
  <main id="view"></main>

  <footer>
    <div>Learn has its own XP and streak, separate from the daily puzzles. Demo progress resets when v0.1 comes out.</div>
    <div class="footer-links"><a href="index.html">daily puzzle</a> · <a href="sandbox.html">sandbox</a> ·
      <a href="https://github.com/pharazyn42/debugg/issues/new" target="_blank" rel="noopener" title="Opens a public GitHub issue">feedback</a> ·
      <a href="privacy.html">privacy</a> · <a href="#" id="resetLearn">reset Learn progress</a></div>
  </footer>
</div>

<script src="shared.js"></script>
<script src="analytics.js"></script>
<script src="learn/courses.js"></script>
<script src="learn/python/01-values.js"></script>
<script src="learn/learn.js"></script>
</body>
</html>
