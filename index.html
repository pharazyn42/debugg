<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debugg</title>
<meta name="description" content="A Wordle-style daily game where you guess what a short, buggy snippet of Python actually prints.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root{
    color-scheme: dark;
    --bg: #131417;
    --panel: #1b1d22;
    --panel-2: #202329;
    --line: #2c2f37;
    --text: #e8e9ec;
    --text-dim: #9498a3;
    --text-faint: #5f6470;
    --amber: #f2b84b;
    --amber-dim: #7a5c22;
    --green: #4fd18b;
    --green-dim: #1f4a35;
    --red: #ef6a6a;
    --red-dim: #4a2222;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'Sora', system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    margin: 0;
    padding-inline: 16px;
    padding-block: 32px;
    display: flex;
    justify-content: center;
  }

  .wrap{ width: 100%; max-width: 560px; }

  header{ text-align: center; margin-bottom: 22px; }
  .kicker{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 8px;
  }
  h1{
    font-family: var(--sans);
    font-weight: 700;
    font-size: 28px;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .sub{
    color: var(--text-dim);
    font-size: 14px;
    margin: 0;
  }

  .tiles{
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 18px 0 20px;
  }
  .tile{
    width: 34px; height: 34px;
    border-radius: 7px;
    border: 1.5px solid var(--line);
    background: var(--panel);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--text-faint);
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .tile.wrong{ border-color: var(--red-dim); background: var(--red-dim); color: var(--red); }
  .tile.correct{ border-color: var(--green-dim); background: var(--green-dim); color: var(--green); }
  .tile.pop{ animation: pop 0.28s ease; }
  @keyframes pop{ 0%{ transform: scale(1); } 40%{ transform: scale(1.15); } 100%{ transform: scale(1); } }

  .hint-track{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: -8px 0 20px;
  }
  .hint-dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.2s ease;
  }
  .hint-dot.used{ background: var(--amber); }
  .hint-track-label{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-left: 2px;
  }

  .editor{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .editor-bar{
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
  }
  .dot{ width: 10px; height: 10px; border-radius: 50%; }
  .dot.r{ background: #ef6a6a; } .dot.y{ background: #f2b84b; } .dot.g{ background: #4fd18b; }
  .filename{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    margin-left: 6px;
  }
  pre{
    margin: 0;
    padding: 16px 18px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.65;
  }
  code{ font-family: var(--mono); }
  .ln{
    display: inline-block;
    width: 1.6em;
    color: var(--text-faint);
    user-select: none;
    margin-right: 1.1em;
  }
  .kw{ color: #c792ea; }
  .fn{ color: #82aaff; }
  .str{ color: #c3e88d; }
  .num{ color: #f78c6c; }
  .flagged{
    display: inline-block;
    border-bottom: 2px dashed transparent;
  }
  .flagged.on{ border-color: var(--amber); }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
  }
  label{
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 8px;
  }
  .guess-row{ display: flex; gap: 8px; }
  input[type=text]{
    flex: 1;
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 11px 12px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-width: 0;
  }
  input[type=text]:focus{ outline: none; border-color: var(--amber); }
  button{
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    padding: 11px 16px;
  }
  .btn-primary{ background: var(--amber); color: #1a1305; }
  .btn-primary:disabled{ opacity: 0.45; cursor: not-allowed; }
  .btn-ghost{
    background: transparent;
    color: var(--text-dim);
    border: 1.5px solid var(--line);
  }
  .btn-ghost:hover{ color: var(--text); border-color: var(--text-faint); }

  .actions{ display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  .feedback{
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 9px;
    font-size: 13.5px;
    line-height: 1.5;
    display: none;
  }
  .feedback.show{ display: block; }
  .feedback.wrong{ background: var(--red-dim); color: #ffc9c9; }
  .feedback.correct{ background: var(--green-dim); color: #baf5d4; }
  .feedback.hint{ background: var(--panel-2); color: var(--text-dim); border: 1px dashed var(--line); }

  .reveal{
    margin-top: 14px;
    padding: 14px;
    border-radius: 9px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-dim);
    display: none;
  }
  .reveal.show{ display: block; }
  .reveal b{ color: var(--text); }
  .reveal code{ background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; color: var(--amber); }

  .reveal p{ margin: 0 0 10px; }
  .reveal p:last-child{ margin-bottom: 0; }
  .wild{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }
  .wild-label{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber);
  }
  .com{ color: var(--text-faint); font-style: italic; }

  footer{
    text-align: center;
    margin-top: 22px;
    color: var(--text-faint);
    font-size: 12px;
    font-family: var(--mono);
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="kicker" id="kicker">Debugg</p>
    <h1>What does this print?</h1>
    <p class="sub">Read the snippet, then guess what the last line prints. You've got 4 guesses.</p>
  </header>

  <div class="tiles" id="tiles"></div>
  <div class="hint-track" id="hintTrack">
    <span class="hint-dot" id="hintDot1"></span>
    <span class="hint-dot" id="hintDot2"></span>
    <span class="hint-track-label">hints used</span>
  </div>

  <div class="editor">
    <div class="editor-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="filename" id="filename"></span>
    </div>
    <pre><code id="code"></code></pre>
  </div>

  <div class="panel">
    <label for="guess">Your guess</label>
    <div class="guess-row">
      <input type="text" id="guess" placeholder="what gets printed?" autocomplete="off">
      <button class="btn-primary" id="submit">Check</button>
    </div>
    <div class="actions">
      <button class="btn-ghost" id="hintBtn">Show hint</button>
      <button class="btn-ghost" id="hint2Btn" hidden>Show another hint</button>
      <button class="btn-ghost" id="revealBtn">Reveal answer</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="reveal" id="reveal">
      <p><b>Answer:</b> <code id="answerOut"></code></p>
      <p id="explainOut"></p>
      <p><b>Fix:</b> <span id="fixOut"></span></p>
      <div class="wild">
        <p class="wild-label">In the wild</p>
        <p id="wildOut"></p>
      </div>
    </div>
  </div>

  <footer>bug streak: <span id="streak">0</span><span id="nextWrap" hidden> · next bug in <span id="nextIn"></span></span> · <a href="#" id="resetLink" style="color:inherit;text-decoration:underline;">reset</a></footer>
</div>

<script src="puzzles.js"></script>
<script>
(function(){
  const MAX_GUESSES = 4;
  // Day 1 is 27 September 2026. The puzzle changes at local midnight.
  const LAUNCH = Date.UTC(2026, 8, 27);
  const DAY_MS = 24 * 60 * 60 * 1000;

  const PUZZLES = window.DEBUGG_PUZZLES;

  const tilesEl = document.getElementById('tiles');
  const kickerEl = document.getElementById('kicker');
  const filenameEl = document.getElementById('filename');
  const codeEl = document.getElementById('code');
  const guessInput = document.getElementById('guess');
  const submitBtn = document.getElementById('submit');
  const hintBtn = document.getElementById('hintBtn');
  const hint2Btn = document.getElementById('hint2Btn');
  const hintDot1 = document.getElementById('hintDot1');
  const hintDot2 = document.getElementById('hintDot2');
  const revealBtn = document.getElementById('revealBtn');
  const feedbackEl = document.getElementById('feedback');
  const revealEl = document.getElementById('reveal');
  const streakEl = document.getElementById('streak');
  const nextWrap = document.getElementById('nextWrap');
  const nextInEl = document.getElementById('nextIn');
  const resetLink = document.getElementById('resetLink');

  // Day number from the player's local calendar date (UTC maths avoids daylight-saving off-by-ones).
  function dayNumber(date){
    const today = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
    return Math.max(1, Math.floor((today - LAUNCH) / DAY_MS) + 1);
  }

  const DAY = dayNumber(new Date());
  const puzzle = PUZZLES[(DAY - 1) % PUZZLES.length];
  const STATE_KEY = 'debugg-day' + DAY;
  const STREAK_KEY = 'debugg-streak';

  let state = { attempts: [], solved: false, revealed: false, hintLevel: 0 };
  let flagEl = null;

  function load(){
    try{
      const raw = localStorage.getItem(STATE_KEY);
      if(raw) state = Object.assign(state, JSON.parse(raw));
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }catch(e){}
  }

  // Streak is { count, lastDay }: lastDay is the last day that was won or lost.
  // Older versions stored a bare number; treat that as a streak ending on day 1.
  function readStreak(){
    try{
      const raw = JSON.parse(localStorage.getItem(STREAK_KEY));
      if(typeof raw === 'number') return { count: raw, lastDay: raw > 0 ? 1 : 0 };
      if(raw && typeof raw.count === 'number') return raw;
    }catch(e){}
    return { count: 0, lastDay: 0 };
  }
  function writeStreak(s){
    try{ localStorage.setItem(STREAK_KEY, JSON.stringify(s)); }catch(e){}
  }
  // A streak survives only if the last finished day was today or yesterday.
  function currentStreak(){
    const s = readStreak();
    return s.lastDay >= DAY - 1 ? s.count : 0;
  }

  // --- Code rendering -------------------------------------------------------

  const PY_KEYWORDS = new Set(['def','return','if','elif','else','for','while','in','not','and','or','is',
    'try','except','finally','raise','with','as','import','from','class','lambda','pass','break',
    'continue','None','True','False','global','nonlocal','yield','del','assert']);

  function escapeHtml(t){
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Tiny Python highlighter: comments, strings, numbers, keywords and called names.
  function highlight(text){
    const re = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)/g;
    let out = '', last = 0, m;
    while((m = re.exec(text))){
      out += escapeHtml(text.slice(last, m.index));
      const tok = escapeHtml(m[0]);
      if(m[1]) out += '<span class="com">' + tok + '</span>';
      else if(m[2]) out += '<span class="str">' + tok + '</span>';
      else if(m[3]) out += '<span class="num">' + tok + '</span>';
      else if(m[4]) out += '<span class="' + (PY_KEYWORDS.has(m[4]) ? 'kw' : 'fn') + '">' + tok + '</span>';
      else out += PY_KEYWORDS.has(m[5]) ? '<span class="kw">' + tok + '</span>' : tok;
      last = m.index + m[0].length;
    }
    return out + escapeHtml(text.slice(last));
  }

  function renderCode(){
    const lines = puzzle.code.split('\n');
    codeEl.innerHTML = lines.map((line, i) => {
      let body = highlight(line);
      const f = puzzle.flag;
      if(f && f.line === i + 1){
        const at = line.indexOf(f.text);
        if(at >= 0){
          body = highlight(line.slice(0, at)) +
            '<span class="flagged" id="flag">' + highlight(f.text) + '</span>' +
            highlight(line.slice(at + f.text.length));
        }
      }
      return '<span class="ln">' + (i + 1) + '</span>' + body;
    }).join('\n');
    flagEl = document.getElementById('flag');
  }

  function renderReveal(){
    document.getElementById('answerOut').textContent = puzzle.display;
    document.getElementById('explainOut').innerHTML = puzzle.explain;
    document.getElementById('fixOut').innerHTML = puzzle.fix;
    document.getElementById('wildOut').innerHTML = puzzle.inTheWild;
  }

  // --- Game -----------------------------------------------------------------

  function renderTiles(){
    tilesEl.innerHTML = '';
    for(let i = 0; i < MAX_GUESSES; i++){
      const t = document.createElement('div');
      t.className = 'tile';
      const result = state.attempts[i];
      if(result === 'correct'){ t.classList.add('correct'); t.textContent = '✓'; }
      else if(result === 'wrong'){ t.classList.add('wrong'); t.textContent = '✕'; }
      tilesEl.appendChild(t);
    }
  }

  function popLastTile(){
    const idx = state.attempts.length - 1;
    const tile = tilesEl.children[idx];
    if(tile){ tile.classList.add('pop'); setTimeout(() => tile.classList.remove('pop'), 280); }
  }

  function showFeedback(kind, text){
    feedbackEl.className = 'feedback show ' + kind;
    feedbackEl.textContent = text;
  }

  function updateHintDots(level){
    hintDot1.classList.toggle('used', level >= 1);
    hintDot2.classList.toggle('used', level >= 2);
  }

  function hintSuffix(){
    if(state.hintLevel === 0) return '';
    if(state.hintLevel === 1) return ' (1 hint used)';
    return ' (2 hints used)';
  }

  function showHints(level){
    feedbackEl.className = 'feedback show hint';
    feedbackEl.innerHTML = '';
    for(let i = 0; i < level; i++){
      const p = document.createElement('p');
      p.style.margin = i === 0 ? '0' : '8px 0 0';
      p.textContent = 'Hint ' + (i + 1) + ': ' + puzzle.hints[i];
      feedbackEl.appendChild(p);
    }
  }

  function lockIn(){
    guessInput.disabled = true;
    submitBtn.disabled = true;
    hintBtn.hidden = true;
    hint2Btn.hidden = true;
    revealBtn.hidden = true;
    if(flagEl) flagEl.classList.add('on');
    revealEl.classList.add('show');
    state.revealed = true;
    save();
    startCountdown();
  }

  // Loose match so "[1, 2]", "1,2" and "1 2" all count, as do answers with or without quotes.
  // Colons keep their neighbours so dict output like {1: 'bool'} normalises to "1:bool".
  function normalise(text){
    return text.toLowerCase()
      .replace(/['"`]/g, '')
      .replace(/[\[\]{}()]/g, ' ')
      .replace(/\s*:\s*/g, ':')
      .replace(/[\s,]+/g, ',')
      .replace(/^,|,$/g, '');
  }
  function checkGuess(text){
    const g = normalise(text);
    return puzzle.answers.some(a => normalise(a) === g);
  }

  function finishRun(won){
    const s = { count: won ? currentStreak() + 1 : 0, lastDay: DAY };
    writeStreak(s);
    streakEl.textContent = s.count;
  }

  function startCountdown(){
    function tick(){
      const now = new Date();
      const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      const mins = Math.max(0, Math.ceil((midnight - now) / 60000));
      nextInEl.textContent = Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm';
    }
    tick();
    nextWrap.hidden = false;
    if(!startCountdown.timer) startCountdown.timer = setInterval(tick, 30000);
  }

  submitBtn.addEventListener('click', () => {
    const val = guessInput.value.trim();
    if(!val || state.solved || state.revealed) return;

    const correct = checkGuess(val);
    state.attempts.push(correct ? 'correct' : 'wrong');
    renderTiles();
    popLastTile();
    guessInput.value = '';

    if(correct){
      state.solved = true;
      showFeedback('correct', 'Correct: ' + puzzle.display + '.' + hintSuffix());
      lockIn();
      finishRun(true);
    }else if(state.attempts.length >= MAX_GUESSES){
      showFeedback('wrong', 'Out of guesses. Here\'s the answer:' + hintSuffix());
      lockIn();
      finishRun(false);
    }else{
      save();
      showFeedback('wrong', puzzle.nudge);
    }
  });

  guessInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') submitBtn.click();
  });

  hintBtn.addEventListener('click', () => {
    state.hintLevel = 1;
    save();
    showHints(1);
    updateHintDots(1);
    hintBtn.hidden = true;
    hint2Btn.hidden = false;
  });

  hint2Btn.addEventListener('click', () => {
    state.hintLevel = 2;
    save();
    showHints(2);
    updateHintDots(2);
    hint2Btn.hidden = true;
  });

  revealBtn.addEventListener('click', () => {
    if(state.solved || state.revealed) return;
    // pad remaining tiles as wrong for a clean stop
    while(state.attempts.length < MAX_GUESSES) state.attempts.push('wrong');
    renderTiles();
    showFeedback('wrong', 'Revealed. No streak today.' + hintSuffix());
    lockIn();
    finishRun(false);
  });

  // Clears every saved day and the streak.
  resetLink.addEventListener('click', (e) => {
    e.preventDefault();
    try{
      Object.keys(localStorage).filter(k => k.startsWith('debugg-')).forEach(k => localStorage.removeItem(k));
    }catch(err){}
    location.reload();
  });

  kickerEl.textContent = 'Debugg · Day ' + DAY;
  filenameEl.textContent = 'day' + DAY + '.py';
  renderCode();
  renderReveal();
  load();
  renderTiles();
  streakEl.textContent = currentStreak();
  updateHintDots(state.hintLevel || 0);
  if(state.hintLevel >= 1){
    hintBtn.hidden = true;
    hint2Btn.hidden = state.hintLevel >= 2;
  }
  if(state.solved){
    lockIn();
    showFeedback('correct', 'Solved: ' + puzzle.display + '.' + hintSuffix());
  }else if(state.revealed){
    lockIn();
    showFeedback('wrong', 'Revealed.' + hintSuffix());
  }else if(state.hintLevel >= 1){
    showHints(state.hintLevel);
  }
})();
</script>
</body>
</html>
