<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What’s new in Debuggit</title>
<meta name="description" content="Every Debuggit release: what changed in the daily puzzle.">
<link rel="icon" href="img/kiwi.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/kiwi-180.png">
<link rel="stylesheet" href="base.css">
<style>
  .wrap{ max-width: 680px; }
  header{ text-align: left; }
  header .brand{ justify-content: flex-start; }
  h1{ font-size: 24px; }
  #notes h2{ font-size: 17px; margin: 30px 0 6px; padding-top: 18px; border-top: 1px solid var(--line); }
  #notes h2:first-child{ border-top: none; padding-top: 0; margin-top: 10px; }
  #notes h3{ font-size: 14px; margin: 16px 0 6px; color: var(--amber); }
  #notes p, #notes li{ color: var(--text-dim); font-size: 14.5px; line-height: 1.65; }
  #notes ul{ padding-left: 20px; margin: 0 0 8px; }
  #notes li{ margin-bottom: 5px; }
  #notes a{ color: var(--amber); }
  #notes code{ font-size: 13px; color: var(--text); background: var(--panel); border-radius: 4px; padding: 1px 5px; }
  #notes .current{ font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--bg);
    background: var(--amber); border-radius: 5px; padding: 2px 6px; margin-left: 8px; vertical-align: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img class="mascot-logo" src="img/kiwi.svg" alt="" width="34" height="34"><a class="wordmark" href="index.html" aria-label="Debuggit" title="Debuggit"><span aria-hidden="true">debugg.<span class="fn">it</span>()</span></a></div>
    <h1 id="title">What’s new</h1>
    <p class="sub" id="sub">Every Debuggit release, newest first.</p>
  </header>

  <main id="notes"><p>Loading…</p></main>

  <footer><a href="index.html" id="backLink">back to Debuggit</a> · <a href="privacy.html">privacy</a><div class="app-version" id="appVersion"></div></footer>
</div>
<script>
// The old addresses, whatsnew.html?ltd and ?learn, now live with their products.
(function(){
  const q = new URLSearchParams(location.search);
  if(q.has('ltd')) location.replace('ltd/whatsnew.html');
  else if(q.has('learn')) location.replace('learn/whatsnew.html');
})();
window.WHATSNEW = { product: 'daily', log: 'CHANGELOG.md', root: '' };
</script>
<script src="shared.js"></script>
<script src="daily/version.js"></script>
<script src="whatsnew.js"></script>
</body>
</html>
