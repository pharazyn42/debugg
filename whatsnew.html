<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What’s new in Debuggit</title>
<meta name="description" content="Every Debuggit release: what changed in the daily puzzle, in Debuggit Ltd and in Debuggit Learn.">
<link rel="icon" href="img/kiwi.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/kiwi-180.png">
<link rel="stylesheet" href="base.css">
<style>
  .wrap{ max-width: 680px; }
  header{ text-align: left; }
  header .brand{ justify-content: flex-start; }
  h1{ font-size: 24px; }
  #notes h2{ font-size: 17px; margin: 30px 0 6px; padding-top: 18px; border-top: 1px solid var(--line); }
  #notes h2:first-child{ border-top: none; padding-top: 0; margin-top: 10px; }
  #notes h3{ font-size: 14px; margin: 16px 0 6px; color: var(--amber); }
  #notes p, #notes li{ color: var(--text-dim); font-size: 14.5px; line-height: 1.65; }
  #notes ul{ padding-left: 20px; margin: 0 0 8px; }
  #notes li{ margin-bottom: 5px; }
  #notes a{ color: var(--amber); }
  #notes code{ font-size: 13px; color: var(--text); background: var(--panel); border-radius: 4px; padding: 1px 5px; }
  #notes .current{ font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--bg);
    background: var(--amber); border-radius: 5px; padding: 2px 6px; margin-left: 8px; vertical-align: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img class="mascot-logo" src="img/kiwi.svg" alt="" width="34" height="34"><a class="wordmark" href="index.html" aria-label="Debuggit" title="Debuggit"><span aria-hidden="true">debugg.<span class="fn">it</span>()</span></a></div>
    <h1 id="title">What’s new</h1>
    <p class="sub" id="sub">Every Debuggit release, newest first.</p>
  </header>

  <main id="notes"><p>Loading…</p></main>

  <footer><a href="index.html" id="backLink">back to Debuggit</a> · <a href="privacy.html">privacy</a><div class="app-version" id="appVersion"></div></footer>
</div>
<script src="shared.js"></script>
<script>
// Shows a list of changes (see "Releases" in CLAUDE.md) with a small Markdown reader: headings,
// lists, paragraphs, **bold**, `code` and [links](…). The daily puzzle's is CHANGELOG.md; with ?ltd
// it's Debuggit Ltd's (ltd/CHANGELOG.md), and with ?learn Debuggit Learn's (learn/CHANGELOG.md).
// Each has its own versions.
//
// The changelogs are the developer log, in full. What players see is curated (see "Releases" in
// CLAUDE.md): while the demo runs (0.0.x, before any 0.1.0) every section is shown; after that only
// the <!-- player --> … <!-- /player --> block of a section, which every minor release (0.1.0,
// 0.2.0…) has, and a patch has only when players would notice the fix.
(function(){
  const D = window.Debugg;
  const params = new URLSearchParams(location.search);
  const product = params.has('learn') ? 'learn' : params.has('ltd') ? 'ltd' : 'daily';
  const P = D.PRODUCTS[product];
  const VERSION = P.version;
  const OTHER = {
    ltd:   { short: 'Ltd',   back: 'index.html?ltd' },
    learn: { short: 'Learn', back: 'learn/' }
  }[product];
  if(OTHER){
    document.title = 'What’s new in ' + P.name;
    document.getElementById('title').textContent = 'What’s new in ' + OTHER.short;
    document.getElementById('sub').textContent = 'Every ' + P.name + ' release, newest first.';
    const back = document.getElementById('backLink');
    back.href = OTHER.back;
    back.textContent = 'back to ' + P.name;
  }
  const esc = D.escapeHtml;
  function inline(text){
    return esc(text)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+|[\w./#?=&-]+)\)/g, '<a href="$2">$1</a>');
  }
  const versionOf = t => { const m = /^(\d+)\.(\d+)\.(\d+)/.exec(t); return m && m.slice(1).map(Number); };
  const cmp = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
  const BLOCK = /<!--\s*player\s*-->([\s\S]*?)<!--\s*\/player\s*-->/g;
  // The markdown players see, and the version to mark "you're here" (the newest one shown that isn't
  // newer than this one, as a hidden patch isn't listed).
  function playerView(md){
    const parts = md.split(/^## /m);
    const sections = parts.slice(1).map(p => {
      const i = p.indexOf('\n');
      return { title: p.slice(0, i).trim(), body: p.slice(i + 1) };
    });
    const launched = sections.some(s => { const v = versionOf(s.title); return v && (v[0] > 0 || v[1] > 0); });
    const mine = versionOf(VERSION);
    let here = null;
    const kept = [];
    sections.forEach(sec => {
      const v = versionOf(sec.title);
      if(!v) return kept.push({ sec, text: sec.body });  // "Unreleased" and the like are handled by render()
      const demo = v[0] === 0 && v[1] === 0;
      const blocks = [...sec.body.matchAll(BLOCK)].map(m => m[1].trim());
      const text = demo && !launched ? sec.body.replace(BLOCK, '$1') : blocks.join('\n\n');
      if(text.trim()) kept.push({ sec, text, v });
    });
    kept.filter(k => k.v && mine && cmp(k.v, mine) <= 0).forEach(k => { if(!here || cmp(k.v, here) > 0) here = k.v; });
    return { md: parts[0] + kept.map(k => '## ' + k.sec.title + '\n\n' + k.text.trim() + '\n').join('\n'),
             here: here && here.join('.') };
  }
  function render(md, here){
    const out = [];
    let list = null, para = [];
    const flush = () => {
      if(para.length){ out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; }
      if(list){ out.push('<ul>' + list.map(li => '<li>' + inline(li) + '</li>').join('') + '</ul>'); list = null; }
    };
    let skipping = false;  // "Unreleased" is for the dev site's notes, not players
    md.split('\n').forEach(line => {
      const h = /^(#{1,3}) (.*)$/.exec(line);
      if(h && h[1].length <= 2) skipping = h[1].length === 2 && /^unreleased/i.test(h[2]);
      if(skipping) return;
      const li = /^\s*[-*] (.*)$/.exec(line);
      if(h){
        flush();
        if(h[1].length === 1) return;  // the file's own title; the page has one
        const level = h[1].length;
        const text = h[2];
        const current = level === 2 && text.startsWith(here + ' ');
        out.push('<h' + level + '>' + inline(text) + (current ? '<span class="current">you’re here</span>' : '') + '</h' + level + '>');
      }else if(li){
        if(para.length) flush();
        (list = list || []).push(li[1]);
      }else if(!line.trim()){
        flush();
      }else if(list && /^\s{2,}\S/.test(line)){
        list[list.length - 1] += ' ' + line.trim();
      }else{
        if(list) flush();
        para.push(line.trim());
      }
    });
    flush();
    return out.join('\n');
  }
  fetch(P.log, { cache: 'no-cache' })
    .then(r => { if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => { const view = playerView(md); document.getElementById('notes').innerHTML = render(view.md, view.here); })
    .catch(() => { document.getElementById('notes').innerHTML = '<p>The list of changes couldn’t load. Try again in a moment.</p>'; });
  D.markVersionSeen(product);
  D.renderVersion(document.getElementById('appVersion'), '', product);
})();
</script>
</body>
</html>
