name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # the Release workflow runs these first

jobs:
  # Runs every puzzle with the real toolchain (python3, node, gcc and clang, rustc; all on the
  # runner image) and checks it prints its answer.
  puzzles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 --version && gcc --version | head -1 && clang --version | head -1 && rustc --version
      - run: node tools/check-puzzles.js

  # A pull request changes one product (the daily puzzle, Debuggit Ltd or Debuggit Learn), unless
  # each one it changes has notes in its changelog
  # (tools/check-scope.js; see "Releases" in CLAUDE.md).
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-scope.js
        env:
          SCOPE_BASE: origin/${{ github.base_ref }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
