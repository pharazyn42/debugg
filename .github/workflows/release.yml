name: Release

# Publishes a version of Debuggit (the daily puzzle: product "daily"), Debuggit Ltd (product "ltd")
# or Debuggit Learn (product "learn"), which are released separately. It runs every test, checks
# shared.js and that product's changelog are at that version, then creates the tag (v<version>,
# ltd-v<version> or learn-v<version>) and a GitHub Release with that version's notes. Start it from
# the Actions tab ("Run workflow", with the product and version), or by pushing the tag yourself.
# See "Releases" in CLAUDE.md.
on:
  workflow_dispatch:
    inputs:
      product:
        description: 'What to release: daily (the daily puzzle), ltd (Debuggit Ltd) or learn (Debuggit Learn)'
        type: choice
        options: [daily, ltd, learn]
        default: daily
      version:
        description: 'Version to release, e.g. 0.0.3 (must match shared.js and that product''s changelog)'
        required: true
  push:
    tags: ['v*', 'ltd-v*', 'learn-v*']

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PRODUCT: ${{ inputs.product || (startsWith(github.ref_name, 'learn-v') && 'learn') || (startsWith(github.ref_name, 'ltd-v') && 'ltd') || 'daily' }}
      VERSION: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          V="${VERSION#learn-}"
          V="${V#ltd-}"
          echo "VERSION=${V#v}" >> "$GITHUB_ENV"
      - run: node tools/release.js "$PRODUCT" check "$VERSION"
      - run: node tools/release.js "$PRODUCT" notes "$VERSION" > notes.md
      # Creates the tag on this commit if it doesn't exist yet (the Run workflow route).
      - run: |
          TAG="$(node tools/release.js "$PRODUCT" tag "$VERSION")"
          NAME="$(node tools/release.js "$PRODUCT" name "$VERSION")"
          # The daily puzzle's releases are the repository's "latest"; Ltd's and Learn's don't take that over.
          LATEST=false; [ "$PRODUCT" = daily ] && LATEST=true
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$NAME" --notes-file notes.md --latest="$LATEST"
