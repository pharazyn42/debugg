<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debuggit Learn</title>
<meta name="description" content="Learn to code from the very start with short lessons: read a little, answer a question, and move on when you get it right.">
<link rel="icon" href="../img/kiwi.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../img/kiwi-180.png">
<link rel="stylesheet" href="../base.css">
<style>
  .stats{
    display: flex;
    gap: 10px;
    margin: 0 0 18px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .stat{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .stat.grow{ flex: 1; }
  .stat-label{ color: var(--text-faint); letter-spacing: 0.06em; text-transform: uppercase; }
  .stat-value{ color: var(--amber); font-size: 20px; font-weight: 600; }
  .stat-note{ color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .xp-bar{ height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .xp-fill{ height: 100%; background: var(--amber); border-radius: 3px; transition: width 0.6s ease; }

  /* The course map */
  /* Continue: the next lesson or checkpoint, one tap away */
  .continue{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--amber);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .continue.done{ display: block; border-color: var(--green-dim); }
  .continue-label{ font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); }
  .continue.done .continue-label{ color: var(--green); }
  .continue h2{ font-size: 18px; margin: 4px 0 2px; }
  .continue p{ color: var(--text-dim); font-size: 13.5px; margin: 0; }
  .continue .btn-primary{ white-space: nowrap; }
  .review-due{
    flex-basis: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    border-top: 1px solid var(--line);
    padding-top: 12px;
    margin-top: 2px;
    font-size: 13.5px;
    color: var(--text-dim);
  }
  .continue.done .review-due{ margin-top: 12px; }
  .review-due span{ flex: 1 1 220px; }
  .review-due b{ color: var(--amber); }
  .review-due .btn-small{ white-space: nowrap; }
  .unit{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .unit.locked, .unit.planned{ opacity: 0.55; }
  .unit.passed{ border-color: var(--green-dim); }
  .unit.focus{ border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
  .unit-head{ display: flex; justify-content: space-between; align-items: center; }
  .unit-num{ font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); }
  .unit-badge{ font-family: var(--mono); font-size: 11px; color: var(--green); }
  .unit-badge.soon{ color: var(--text-faint); }
  .soon-badge{ font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; margin-left: 4px; }
  .course-section{ margin: 26px 0 12px; padding-top: 16px; border-top: 1px solid var(--line); }
  .section-title{ font-size: 20px; margin: 0 0 4px; }
  .section-summary{ color: var(--text-dim); font-size: 13.5px; margin: 0; line-height: 1.5; }
  .unit h2{ font-size: 18px; margin: 6px 0 4px; }
  .unit-summary, .unit-lock, .unit-note{ color: var(--text-dim); font-size: 13.5px; margin: 0 0 12px; line-height: 1.5; }
  .unit-note{ margin: 10px 0 0; font-size: 12.5px; color: var(--text-faint); }
  .lessons{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .lesson-row{
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    text-align: left;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    font-weight: 500;
  }
  .lesson-row:hover:not(:disabled){ border-color: var(--text-faint); }
  .lesson-row:disabled{ color: var(--text-faint); cursor: not-allowed; }
  .lesson-row.checkpoint{ border-style: dashed; }
  .lesson-row.done .lesson-name{ color: var(--text-dim); }
  .lesson-state{ font-family: var(--mono); font-size: 12px; color: var(--amber); white-space: nowrap; }
  .stars{ letter-spacing: 0.1em; }

  /* A lesson */
  .session-top{ display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .btn-small{ padding: 7px 11px; font-size: 12.5px; }
  .progress{ flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .progress-fill{ height: 100%; background: var(--green); border-radius: 4px; transition: width 0.3s ease; }
  .progress-num{ font-family: var(--mono); font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .step{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
  }
  .step h3{ margin: 0 0 8px; font-size: 17px; }
  .teach, .question{ color: var(--text); font-size: 15px; line-height: 1.6; margin: 0 0 14px; }
  .question{ font-weight: 600; }
  .teach code, .question code, .feedback code{
    background: var(--bg);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.9em;
  }
  .step .editor{ margin: 0 0 14px; white-space: pre; }
  .step .editor code{ display: block; }
  .output{ background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0 0 14px; }
  .output-label{ font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }
  .output pre{ margin: 6px 0 0; font-family: var(--mono); font-size: 14px; color: var(--green); }
  .options{ display: flex; flex-direction: column; gap: 8px; margin: 0 0 12px; }
  .option{
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    background: var(--panel-2);
    color: var(--text);
    border: 1.5px solid var(--line);
    font-weight: 500;
  }
  .option:hover:not(:disabled){ border-color: var(--amber); }
  .option:disabled{ cursor: default; }
  .option.right{ border-color: var(--green); background: var(--green-dim); }
  .option.wrong{ border-color: var(--red); background: var(--red-dim); }
  /* Keyboard hints: press 1–4 to pick. Hidden where there's no keyboard to speak of. */
  .key{
    flex: none;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1;
    color: var(--text-faint);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 3px 5px;
  }
  @media (hover: none){ .key{ display: none; } }
  .gap{ border-bottom: 2px solid var(--amber); padding: 0 3px; color: var(--amber); }
  .code-line{
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 0 6px;
    font: inherit;
    color: inherit;
    white-space: pre;
  }
  .code-line:hover:not(:disabled){ border-color: var(--amber); }
  .code-line:disabled{ cursor: default; }
  .code-line.right{ border-color: var(--green); background: var(--green-dim); }
  .code-line.wrong{ border-color: var(--red); background: var(--red-dim); }
  .feedback{ display: none; border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.55; margin: 0 0 12px; }
  .feedback.show{ display: flex; gap: 12px; align-items: flex-start; }
  .feedback > div{ flex: 1; min-width: 0; }
  .fb-mascot{ flex: none; width: 36px; height: 36px; }
  .feedback.correct .fb-mascot{ animation: mascot-hop 0.55s ease 1; }
  .feedback.wrong .fb-mascot{ transform: rotate(-14deg); }
  .feedback.correct{ background: var(--green-dim); color: #d8f5e5; }
  .feedback.wrong{ background: var(--red-dim); color: #f7dada; }
  .feedback .right-answer{ display: block; margin: 6px 0 2px; font-weight: 600; }
  .feedback .again{ display: block; margin-top: 8px; font-size: 12.5px; opacity: 0.8; }
  .run-link{ display: inline-block; font-family: var(--mono); font-size: 12.5px; color: var(--amber); margin: 0 0 14px; }
  .feedback .run-link{ display: block; margin: 8px 0 0; color: inherit; text-decoration: underline; }
  .step-actions{ display: flex; gap: 8px; flex-wrap: wrap; }
  .step-actions [hidden]{ display: none; }
  .guess-row{ margin-bottom: 12px; }

  .summary-mascot{ display: block; margin: 0 auto 6px; animation: mascot-hop 0.55s ease 2; }
  .summary-mascot.dizzy{ animation: none; transform: rotate(-14deg); }
  @keyframes mascot-hop{ 50%{ transform: translateY(-8px) rotate(-6deg); } }
  /* Celebrations: stars pop in, a level-up and a streak that went up today. */
  .big-stars .star{ display: inline-block; }
  .big-stars .star.on{ animation: star-pop 0.4s ease both; }
  @keyframes star-pop{ 0%{ transform: scale(0.2); opacity: 0; } 70%{ transform: scale(1.3); opacity: 1; } 100%{ transform: scale(1); } }
  .level-up{
    display: inline-block;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--bg) !important;
    background: var(--amber);
    border-radius: 999px;
    padding: 5px 12px;
    animation: star-pop 0.5s ease 0.7s both;
  }
  .streak-up{ color: var(--amber); }
  @media (prefers-reduced-motion: reduce){
    .summary-mascot, .feedback.correct .fb-mascot, .big-stars .star.on, .level-up{ animation: none; }
    .progress-fill, .xp-fill{ transition: none; }
  }
  .summary{ background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px 18px; text-align: center; }
  .summary h2{ margin: 4px 0 8px; }
  .summary p{ color: var(--text-dim); margin: 0 0 12px; }
  .summary .step-actions{ justify-content: center; }
  .big-stars{ font-size: 34px; color: var(--amber) !important; letter-spacing: 0.12em; margin: 0 !important; }
  .big-score{ font-family: var(--mono); font-size: 34px; color: var(--amber) !important; margin: 0 !important; }
  footer .footer-links{ margin-top: 6px; line-height: 1.8; }
  footer a{ color: inherit; text-decoration: underline; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <nav class="modes" aria-label="Debuggit"><a class="lang-tab" href="./" id="learnTab" aria-current="page" title="Learn to code">debugg.learn()</a><a class="lang-tab" href="../index.html" id="dailyTab" title="The daily puzzle">debugg(it) <span class="demo-tag">(demo)</span></a><a class="lang-tab" href="../index.html?ltd" id="ltdTab" title="The studio game">debugg.ltd() <span class="demo-tag">(demo)</span></a></nav>
    <div class="brand"><img class="mascot-logo" src="../img/kiwi.svg" alt="" width="34" height="34"><a class="wordmark" id="wordmark" href="./" aria-label="Debuggit Learn">debugg.learn()</a></div>
    <h1 id="title">Learn</h1>
    <p class="sub" id="sub"></p>
  </header>

  <nav class="langs" id="langs" aria-label="Course" hidden></nav>
  <div class="stats" id="stats"></div>
  <main id="view"></main>

  <footer>
    <div>Learn has its own XP and streak, separate from the daily puzzles. Demo progress resets when v0.1 comes out.</div>
    <div class="footer-actions">
      <button class="btn-ghost save-btn" id="backupLink" type="button" title="Keep a code that brings your progress back on any device">Save progress</button>
      <a class="btn-ghost" href="sandbox.html">Sandbox</a>
      <a class="btn-ghost" href="https://github.com/pharazyn42/debugg/issues/new" target="_blank" rel="noopener" title="Opens a public GitHub issue">Feedback</a>
    </div>
    <div class="footer-links"><a href="../privacy.html">privacy</a> · <a href="#" id="resetLearn">reset Learn progress</a></div>
    <div class="app-version" id="appVersion"></div>
  </footer>
</div>

<script src="../shared.js"></script>
<script src="../analytics.js"></script>
<script src="../backup.js"></script>
<script src="courses.js"></script>
<script src="python/01-values.js"></script>
<script src="python/02-strings.js"></script>
<script src="python/03-lists.js"></script>
<script src="python/04-conditions.js"></script>
<script src="python/05-loops.js"></script>
<script src="python/06-functions.js"></script>
<script src="learn.js"></script>

</body>
